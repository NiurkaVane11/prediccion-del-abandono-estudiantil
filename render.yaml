# Blueprint de Render: describe el servicio como código (Infrastructure as
# Code). Render lo lee al crear el servicio desde "New > Blueprint".
services:
  - type: web
    name: prediccion-abandono-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # Render llama a este endpoint para saber si la API está viva; si falla,
    # no enruta tráfico a la nueva versión.
    healthCheckPath: /salud
    envVars:
      # sync: false -> Render pide el valor al crear el servicio; la clave
      # nunca queda escrita en el repo.
      - key: API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
